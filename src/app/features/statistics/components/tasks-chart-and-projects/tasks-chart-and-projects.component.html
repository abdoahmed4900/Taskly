<section class="mt-10 grid grid-cols-1 gap-8 lg:grid-cols-2">
  <!-- Tasks By Status -->
  <div class="rounded-xl border border-slate-100 bg-white p-8 shadow-sm">
    <h2 class="text-2xl font-bold text-[#0d2346]">Tasks by Status</h2>

    <div class="mt-10 flex flex-col items-center gap-10 md:flex-row">
      <!-- Donut -->
      <div class="relative h-64 w-64 shrink-0">
        <svg viewBox="0 0 200 200" class="-rotate-90" xmlns="http://www.w3.org/2000/svg">
          <!-- Background -->
          <circle cx="100" cy="100" r="70" fill="none" stroke="#e8edff" stroke-width="32" />

          <!-- In Progress -->
          <circle
            cx="100"
            cy="100"
            r="70"
            fill="none"
            stroke="#0645a5"
            stroke-width="32"
            stroke-dasharray="220 440"
            stroke-linecap="butt"
          />

          <!-- Blocked -->
          <circle
            cx="100"
            cy="100"
            r="70"
            fill="none"
            stroke="#c9181e"
            stroke-width="32"
            stroke-dasharray="55 440"
            stroke-dashoffset="-220"
            stroke-linecap="butt"
          />

          <!-- Done -->
          <circle
            cx="100"
            cy="100"
            r="70"
            fill="none"
            stroke="#005c3f"
            stroke-width="32"
            stroke-dasharray="165 440"
            stroke-dashoffset="-275"
            stroke-linecap="butt"
          />
        </svg>

        <!-- Center -->
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-4xl font-bold text-slate-800">{{ stats()?.totalTasks }}</span>
          <span class="text-lg font-semibold text-slate-400">Total</span>
        </div>
      </div>

      <!-- Legend -->
      <div class="w-full space-y-7">
        @for (item of statusOptions; track $index) {
          <div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span
                  class="h-4 w-4 rounded-full"
                  [class.bg-(--error)]="item === 'BLOCKED'"
                  [class.bg-(--primary)]="item === 'IN_PROGRESS'"
                  [class.bg-(--success)]="item === 'DONE'"
                  [class.bg-gray-300]="item === 'TO_DO'"
                  [class.bg-yellow-300]="item === 'IN_REVIEW'"
                  [class.bg-green-500]="item === 'READY_FOR_QA'"
                  [class.bg-red-300]="item === 'REOPENED'"
                  [class.bg-green-700]="item === 'READY_FOR_PRODUCTION'"
                >
                </span>
                <span class="font-bold text-slate-600">{{ item.replaceAll('_', ' ') }}</span>
              </div>

              <span class="font-bold text-[#0d2346]">{{ stats()!.totals[item] }}</span>
            </div>

            <div class="mt-2 ml-7 h-1.5 overflow-hidden rounded-full bg-blue-100">
              <div class="h-full bg-blue-700" [style.width.%]="getChartRowWidth(stats()?.totals![item] ?? 0)"></div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- All Projects -->
  <div class="rounded-xl border border-slate-100 bg-white p-8 shadow-sm">
    <h2 class="text-2xl font-bold text-[#0d2346]">All Projects</h2>

    <div class="mt-10 space-y-7">
      <div class="flex items-center justify-between gap-5">
        <span class="font-bold text-slate-600"> Skyline Residency </span>

        <span class="font-bold text-[#0d2346]"> 45 Tasks </span>
      </div>

      <div class="flex items-center justify-between gap-5">
        <span class="font-bold text-slate-600"> Urban Center Phase 2 </span>

        <span class="font-bold text-[#0d2346]"> 28 Tasks </span>
      </div>

      <div class="flex items-center justify-between gap-5">
        <span class="font-bold text-slate-600"> Green Valley Office </span>

        <span class="font-bold text-[#0d2346]"> 12 Tasks </span>
      </div>
    </div>
  </div>
</section>
