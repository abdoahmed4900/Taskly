<div class="p-6 bg-[#F8F9FF] min-h-screen">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-(--slate-nature-first) font-bold text-[1.875rem] leading-9 tracking-[-0.75px] align-middle">
      Weekly Planner
    </h1>

    <p class="font-normal text-[1rem] leading-6 tracking-normal align-middle text-(--paragraph-text-common-color)">
      Manage your deadlines and track team velocity.
    </p>
  </div>

  <!-- Filter Section -->
  <app-calendar-range-text (statsOutput)="setStats($event)"></app-calendar-range-text>

  <!-- Stats -->
  <app-calendar-stats [stats]="stats()!"></app-calendar-stats>
  <section class="grid mt-4 grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-7">
    @for (item of stats()?.daily; track $index) {
      <div class="min-h-142.5 overflow-scroll rounded-xl border border-slate-100 bg-white p-5 shadow-sm">
        <p class="text-sm font-bold uppercase text-slate-400">Mon</p>
        <h2 class="mt-1 text-2xl font-bold text-[#0d2346]">{{ formatStatDay(item.day) }}</h2>

        <div class="mt-8 space-y-3">
          @for (status of statusOptions; track $index) {
            @if (item.statuses[status]) {
              <div class="flex items-center flex-wrap justify-between rounded bg-slate-50 px-3 py-3">
                <span class="text-sm font-bold text-slate-500"> {{ status.replaceAll('_', ' ') }}</span>
                <span class="font-bold text-[#0d2346]">{{ item.statuses[status] }}</span>
              </div>
            }
          }
        </div>
      </div>
    }
  </section>

  <!-- ===================== BOTTOM ===================== -->
  <app-tasks-chart-and-projects [stats]="stats()!"></app-tasks-chart-and-projects>
</div>
