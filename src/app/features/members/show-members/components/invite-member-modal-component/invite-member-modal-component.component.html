<div
  appClickOutside
  (clickOutside)="close()"
  class="flex p-8 bg-white max-w-md w-full rounded-xl flex-col gap-4 absolute top-[50%] translate-[-50%] z-10 left-[50%]"
>
  <div class="flex flex-row w-full justify-between items-center">
    <div class="p-3 rounded-lg bg-(--surface-low)">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M17 10V7H14V5H17V2H19V5H22V7H19V10H17ZM8 8C6.9 8 5.95833 7.60833 5.175 6.825C4.39167 6.04167 4 5.1 4 4C4 2.9 4.39167 1.95833 5.175 1.175C5.95833 0.391667 6.9 0 8 0C9.1 0 10.0417 0.391667 10.825 1.175C11.6083 1.95833 12 2.9 12 4C12 5.1 11.6083 6.04167 10.825 6.825C10.0417 7.60833 9.1 8 8 8ZM0 16V13.2C0 12.6333 0.145833 12.1125 0.4375 11.6375C0.729167 11.1625 1.11667 10.8 1.6 10.55C2.63333 10.0333 3.68333 9.64583 4.75 9.3875C5.81667 9.12917 6.9 9 8 9C9.1 9 10.1833 9.12917 11.25 9.3875C12.3167 9.64583 13.3667 10.0333 14.4 10.55C14.8833 10.8 15.2708 11.1625 15.5625 11.6375C15.8542 12.1125 16 12.6333 16 13.2V16H0Z"
          fill="#003D9B"
        />
      </svg>
    </div>
    <svg
      tabindex="0"
      (keydown)="close()"
      (click)="close()"
      width="14"
      height="14"
      viewBox="0 0 14 14"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14Z"
        fill="#737685"
      />
    </svg>
  </div>
  <h2 class="font-bold text-[1.5rem] leading-8 tracking-[-0.6px] text-(--slate-nature-first) align-middle">
    Invite Team Member
  </h2>
  <p class="font-normal text-[0.875rem] leading-5 tracking-normal text-(--slate-nature-second) align-middle">
    Enter the email of the person you want to invite.
  </p>
  <div class="flex flex-col gap-4 w-full my-2">
    <app-form-field-component
      [control]="getFormControl('email')"
      controlName="Email"
      label="Email Address"
      type="email"
      placeholder="Enter Email Address"
    ></app-form-field-component>
  </div>
  <div class="flex flex-row gap-2">
    <button
      (click)="close()"
      class="w-full font-semibold text-[0.875rem] leading-5 tracking-normal text-center align-middle text-(--slate-nature-second)"
    >
      Cancel
    </button>
    <button
      (click)="inviteMember()"
      class="bg-primary-gradient w-full text-white py-3 px-4 rounded-sm hover:bg-blue-800"
    >
      Send Invitation
    </button>
  </div>
</div>
