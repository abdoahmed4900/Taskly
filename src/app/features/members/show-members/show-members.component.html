<main class="flex flex-col lg:gap-10 gap-3 lg:m-8 lg:mb-30 mb-53 mt-8">
  <header class="flex flex-col lg:items-start items-center gap-4">
    <div class="lg:flex hidden flex-row items-center justify-start gap-2">
      <a
        routerLink="/projects"
        class="font-bold text-[0.75rem] uppercase tracking-[1.2px] leading-4 align-middle text-[#43465499]"
      >
        PROJECTS
      </a>
      <svg width="4" height="6" viewBox="0 0 4 6" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.3 3L0 0.7L0.7 0L3.7 3L0.7 6L0 5.3L2.3 3Z" fill="#434654" fill-opacity="0.4" />
      </svg>
      <p class="font-bold text-[0.75rem] uppercase tracking-[1.2px] leading-4 align-middle text-[#43465499]">
        {{ project().name === '' ? 'PROJECT TITLE' : project().name }}
      </p>
      <svg width="4" height="6" viewBox="0 0 4 6" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.3 3L0 0.7L0.7 0L3.7 3L0.7 6L0 5.3L2.3 3Z" fill="#434654" fill-opacity="0.4" />
      </svg>
      <p class="font-bold text-[0.75rem] uppercase tracking-[1.2px] leading-4 align-middle text-(--primary)">MEMBERS</p>
    </div>
    <div class="flex flex-row items-center justify-between w-full">
      <p class="font-semibold text-[2.25rem] leading-10 tracking-[-0.9] align-middle text-(--slate-nature-first)">
        Project Members
      </p>
      <button
        (click)="updateInviteModalState(); $event.stopPropagation()"
        class="lg:flex hidden bg-primary-gradient rounded-sm px-6 py-4 text-white flex-row items-center gap-2"
      >
        <svg width="19" height="14" viewBox="0 0 19 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M14.1667 8.33333V5.83333H11.6667V4.16667H14.1667V1.66667H15.8333V4.16667H18.3333V5.83333H15.8333V8.33333H14.1667ZM6.66667 6.66667C5.75 6.66667 4.96528 6.34028 4.3125 5.6875C3.65972 5.03472 3.33333 4.25 3.33333 3.33333C3.33333 2.41667 3.65972 1.63194 4.3125 0.979167C4.96528 0.326389 5.75 0 6.66667 0C7.58333 0 8.36806 0.326389 9.02083 0.979167C9.67361 1.63194 10 2.41667 10 3.33333C10 4.25 9.67361 5.03472 9.02083 5.6875C8.36806 6.34028 7.58333 6.66667 6.66667 6.66667ZM0 13.3333V11C0 10.5278 0.121528 10.0938 0.364583 9.69792C0.607639 9.30208 0.930556 9 1.33333 8.79167C2.19444 8.36111 3.06944 8.03819 3.95833 7.82292C4.84722 7.60764 5.75 7.5 6.66667 7.5C7.58333 7.5 8.48611 7.60764 9.375 7.82292C10.2639 8.03819 11.1389 8.36111 12 8.79167C12.4028 9 12.7257 9.30208 12.9688 9.69792C13.2118 10.0938 13.3333 10.5278 13.3333 11V13.3333H0ZM1.66667 11.6667H11.6667V11C11.6667 10.8472 11.6285 10.7083 11.5521 10.5833C11.4757 10.4583 11.375 10.3611 11.25 10.2917C10.5 9.91667 9.74306 9.63542 8.97917 9.44792C8.21528 9.26042 7.44444 9.16667 6.66667 9.16667C5.88889 9.16667 5.11806 9.26042 4.35417 9.44792C3.59028 9.63542 2.83333 9.91667 2.08333 10.2917C1.95833 10.3611 1.85764 10.4583 1.78125 10.5833C1.70486 10.7083 1.66667 10.8472 1.66667 11V11.6667ZM6.66667 5C7.125 5 7.51736 4.83681 7.84375 4.51042C8.17014 4.18403 8.33333 3.79167 8.33333 3.33333C8.33333 2.875 8.17014 2.48264 7.84375 2.15625C7.51736 1.82986 7.125 1.66667 6.66667 1.66667C6.20833 1.66667 5.81597 1.82986 5.48958 2.15625C5.16319 2.48264 5 2.875 5 3.33333C5 3.79167 5.16319 4.18403 5.48958 4.51042C5.81597 4.83681 6.20833 5 6.66667 5Z"
            fill="white"
          />
        </svg>

        <span class="font-bold text-[0.875rem] leading-5 text-center align-middle">Invite Member</span>
      </button>
    </div>
  </header>

  @defer (when isLoaded()) {
    <app-members-list-mobile-component [members]="members()"></app-members-list-mobile-component>
    <app-members-table-component [members]="members()"></app-members-table-component>
  } @loading (minimum 500ms) {
    @for (item of [1, 2, 3]; track $index) {
      <div
        class="p-6 lg:hidden bg-white shadow-(--card-or-button-shadow) rounded-lg w-full flex flex-row justify-between items-center gap-4"
      >
        <div class="flex flex-row gap-4">
          <div class="skeleton-basic h-15 w-20"></div>
          <div class="flex flex-col my-2 items-center gap-2">
            <div class="skeleton-basic w-30 h-6"></div>
            <div class="skeleton-basic w-30 h-4"></div>
          </div>
        </div>

        <div class="skeleton-basic h-5 w-20 p-3"></div>
      </div>
    }
    <table
      class="w-full hidden lg:table max-w-196.25 border-spacing-4 mx-auto shadow-[0px_1px_2px_0px_#0000000D] border-4 border-separate border-gray-200 rounded-lg"
    >
      <thead class="bg-[#E0E8FF4D] border-b p-4">
        <tr>
          <td class="skeleton-basic h-7 w-40"></td>
          <td class="skeleton-basic h-7 w-10"></td>
          <td class="skeleton-basic h-7 w-5"></td>
        </tr>
      </thead>
      @for (item of [1, 2, 3]; track $index) {
        <tr class="p-4 border-b border-gray-200 last:border-0">
          <td class="skeleton-basic h-7 w-40"></td>
          <td class="skeleton-basic h-7 w-10"></td>
          <td class="skeleton-basic h-7 w-5"></td>
        </tr>
      }
    </table>
  }
  @if (isInviteModalOpen()) {
    <div class="fixed inset-0 z-10 overflow-auto bg-black/50 backdrop-blur-sm">
      <app-invite-member-modal-component
        [projectId]="project().id!"
        (closeModalOutput)="setInviteModalState($event)"
      ></app-invite-member-modal-component>
    </div>
  }
</main>
